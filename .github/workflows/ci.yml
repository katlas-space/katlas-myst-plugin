name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/katlas-myst-plugin

      - name: Build
        run: npm run build
        working-directory: packages/katlas-myst-plugin

      - name: Test
        run: npm test
        working-directory: packages/katlas-myst-plugin

      - name: Confirm dist/index.mjs produced
        run: test -s packages/katlas-myst-plugin/dist/index.mjs
